<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
  <!-- Position Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>No.</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="employee_name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">{{ element.employee_name }}</td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="employee_age">
    <th mat-header-cell *matHeaderCellDef>Weight</th>
    <td mat-cell *matCellDef="let element">{{ element.employee_age }}</td>
  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns"
    style="color: #fff; background-color: #212529; border-color: #32383e"
  ></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns"
    (click)="test(row, $event)"
  ></tr>
  <!-- <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="test(row, $event)" (click)="clickedRows.add(row)" [class.demo-row-is-clicked]="clickedRows.has(row)"></tr> -->
</table>
